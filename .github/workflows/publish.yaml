name: Publish Module

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release version
        run: python3 -c "import os; tag = os.environ['GITHUB_REF'].split('/')[-1]; f = open(os.environ['GITHUB_ENV'], 'a'); f.write('RELEASE_VERSION='+tag); f.close();"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Install Go dependencies
        run: go mod download
      - name: Run go tidy
        run: go mod tidy
      - name: Run tests
        run: go test ./...
      - name: Go list
        run: GOPROXY=proxy.golang.org go list -m github.com/ParceladoLara/payment-plan-go-sdk@${{ env.RELEASE_VERSION }}
